<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngasir - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <!-- Brand & Tagline Sisi Kiri -->
        <div class="login-brand">
            <h1 class="login-logo">Ngasir</h1>
            <p class="login-tagline">Jualan makin cepat,<br>pelanggan makin puas.</p>
        </div>

        <!-- Form Login Sisi Kanan -->
        <div class="login-card">
            <form action="dashboard.html" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan Username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan Password" required>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
